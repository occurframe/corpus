name: Corpus authority CI

on:
  pull_request:
  push:
    branches: [dev, main]

jobs:
  correctness:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout corpus
        uses: actions/checkout@v4
      - name: Checkout pinned Occurframe tooling
        uses: actions/checkout@v4
        with:
          repository: occurframe/occurframe
          ref: fb7da485c36fa7d5a48245437747312f78dc81a4
          path: .tooling
      - name: Checkout immutable RC2 authority for the historical migration proof
        uses: actions/checkout@v4
        with:
          repository: occurframe/corpus
          ref: 5790faa3b886ff9ec3805283e218ea11a8c6dd24
          path: .rc2-authority
      - uses: dtolnay/rust-toolchain@stable
      - name: Schema, corpus, stable-ID, and registry validation
        run: cargo run --manifest-path .tooling/Cargo.toml -p xtask -- validate --corpus .
      - name: RC1 to RC2 semantic migration verification
        run: cargo run --manifest-path .tooling/Cargo.toml -p xtask -- verify-migration --legacy-vectors .rc2-authority/legacy/phase2-rc1/vectors --corpus .rc2-authority
      - name: Deterministic pack verification
        run: cargo run --manifest-path .tooling/Cargo.toml -p xtask -- verify-deterministic --corpus .
      - name: Generate release candidate pack
        run: cargo run --manifest-path .tooling/Cargo.toml -p xtask -- pack --corpus . --output dist/occurframe-corpus-1.0.0-rc3
      - name: Manifest digest verification
        run: cargo run --manifest-path .tooling/Cargo.toml -p xtask -- verify-manifest --output dist/occurframe-corpus-1.0.0-rc3
      - name: Independent Python reference cases
        run: python -m unittest discover -s tests/reference -v

  legacy-checksums:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable RC1 evidence
        working-directory: legacy/phase2-rc1
        run: sha256sum --check SHA256SUMS

# Fast correctness CI is intentionally not full differential certification.
# External engines are not executed in ordinary pull requests.
